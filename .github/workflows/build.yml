name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Net drivers (Intel/Realtek) from Microsoft Update Catalog, then rebuild with them embedded
        continue-on-error: true
        shell: pwsh
        run: |
          ./devtools/make-net-drivers.ps1
          if (Test-Path assets/net-drivers.zip) { cmd /c build.cmd }

      - name: Check answer-file generator (XML + embedded PowerShell syntax)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File devtools\check-gen.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash bin\Buba-Helper.exe -Algorithm SHA256).Hash.ToLower()
          "$h *Buba-Helper.exe" | Out-File -Encoding ascii bin\Buba-Helper.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Buba-Helper
          path: |
            bin/Buba-Helper.exe
            bin/Buba-Helper.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Buba-Helper
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Buba-Helper.exe
            dist/Buba-Helper.exe.sha256
          generate_release_notes: true

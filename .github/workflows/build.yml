name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Check answer-file generator (XML + embedded PowerShell syntax)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File devtools\check-gen.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash bin\Buba-Helper.exe -Algorithm SHA256).Hash.ToLower()
          "$h *Buba-Helper.exe" | Out-File -Encoding ascii bin\Buba-Helper.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Buba-Helper
          path: |
            bin/Buba-Helper.exe
            bin/Buba-Helper.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Buba-Helper
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Buba-Helper.exe
            dist/Buba-Helper.exe.sha256
          generate_release_notes: true

# Профиль Buba-Helper (вкладка «Установка ISO/WIM»). Сохраняется кнопкой «Сохранить профиль», можно править руками.
# Запуск:  Buba-Helper.exe --profile office.ini --auto
#
# source   - полный путь ИЛИ просто имя файла (будет найдено поиском по всем дискам)
# edition  - название редакции (или её часть), либо номер индекса в образе
# mode     - wipe: стереть весь диск и разметить заново | keep: форматировать только раздел Windows
# scheme   - gpt | mbr (в режиме keep определяется по диску)
# sizeMB   - размер раздела Windows в мегабайтах (51200 = 50 ГБ) либо all
# data     - 1: остаток диска отдать под раздел Data (только mode=wipe)
# recovery - 1: создать раздел восстановления (Windows RE, 1024 МБ) после раздела Windows (только mode=wipe)
# drivers  - папка с драйверами (относительный путь - от папки exe) либо пусто
# xml      - unattend.xml, копируется в Windows\Panther\Unattend; пусто = без XML
# reboot   - 1: перезагрузить после установки (с отсчётом 15 с)
# verify   - 1: проверять SHA-256, если рядом с образом есть <файл>.sha256
# disk     - auto (единственный внутренний не-USB диск) либо номер диска

source=install.wim
edition=Pro
mode=wipe
scheme=gpt
sizeMB=51200
data=1
recovery=1
drivers=Drivers
xml=
reboot=1
verify=1
disk=auto
